name: MiniAssist Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniassist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MiniAssist 1.9.1 (Fabric 1.21.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || test -f build.gradle.kts
          test -d src/main/java
          test -f src/main/resources/fabric.mod.json
          grep -q '^mod_version=1.9.1$' gradle.properties
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Gradle: $(gradle --version | grep '^Gradle ' | head -1)"

      - name: Build MiniAssist
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean build 2>&1 | tee "$RUNNER_TEMP/miniassist-build.log"

      - name: Verify and prepare JAR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="build/libs/zenith-client-1.9.1.jar"
          if [ ! -s "$JAR_FILE" ]; then
            echo "Expected JAR not found: $JAR_FILE"
            find build -type f -name '*.jar' -print || true
            exit 1
          fi
          jar tf "$JAR_FILE" > "$RUNNER_TEMP/miniassist-jar-contents.txt"
          grep -Fxq 'fabric.mod.json' "$RUNNER_TEMP/miniassist-jar-contents.txt"
          unzip -p "$JAR_FILE" fabric.mod.json | grep -Fq '"version": "1.9.1"'
          mkdir -p artifacts
          cp "$JAR_FILE" artifacts/zenith-client-1.9.1.jar

      - name: Upload MiniAssist JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-1.9.1
          path: artifacts/zenith-client-1.9.1.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-build-log
          path: ${{ runner.temp }}/miniassist-build.log
          if-no-files-found: ignore
          retention-days: 7
